name: Build and Test

# Unsigned simulator build + unit tests on every push.
# No Apple Developer account, no signing secrets, no TestFlight - by design.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # macos-26 runners ship Xcode 26 / iOS 26 SDK. If the label is
    # unavailable on your account, change to macos-latest and select
    # the newest Xcode in the step below.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test (simulator, unsigned)
        run: |
          xcodebuild test \
            -scheme Dayline \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
