name: Build and Test

# Unsigned simulator build + unit tests on every push.
# No Apple Developer account, no signing secrets, no TestFlight - by design.
#
# On failure, the workflow files a GitHub issue containing the compiler /
# test errors extracted from the build log. Reason: full run logs require
# account auth to download, but issues on the repo are readable by anyone
# with repo access - including the AI agent working on this code, which
# only has a git deploy key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-test:
    # macos-26 runners ship Xcode 26 / iOS 26 SDK. If the label is
    # unavailable on your account, change to macos-latest and select
    # the newest Xcode in the step below.
    runs-on: macos-26
    # A hung xcodebuild used to burn the 6h default; rapid pushes
    # queued duplicate full builds.
    timeout-minutes: 30
    concurrency:
      group: ci-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          # The toolchain was unpinned: the repo has already been
          # patched twice for Xcode 27 strictness (SWIFT_VERSION 5.0,
          # PRODUCT_NAME). Pin the CI toolchain explicitly.
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode 26.6 not found; using the runner default:"
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # A name-based destination is brittle: one runner (2026-10-20,
          # commit d168955) had no matching simulator at all and the run
          # died before compiling. Resolve the first available iPhone
          # simulator's UDID instead and build against that.
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator: $SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test (simulator, unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Dayline \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.id }}' \
            -resultBundlePath test.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Assert tests actually ran
        if: always()
        run: |
          # A 0-test run exits 0 and files no issue — the suite can lose
          # its tests silently (a renamed test file, a lost test bundle).
          # Fail unless the log proves tests executed.
          COUNT=$(grep -oE "Executed [0-9]+ tests" build.log 2>/dev/null | tail -1 | grep -oE "[0-9]+" || true)
          echo "Tests executed: ${COUNT:-none found}"
          echo "### Tests executed: ${COUNT:-none found}" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$COUNT" ] && [ "$COUNT" -ge 1 ] || { echo "FAIL: no test execution found in build.log"; exit 1; }

      - name: Report failure as an issue
        if: failure() && steps.build.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "CI build/test failed for commit ${GITHUB_SHA}."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## Errors extracted from build.log'
            echo '```'
            grep -E "error:|BUILD FAILED|TEST FAILED|Failing tests:|failed \(|XCTAssert" build.log | head -120 || echo "(no lines matched the error patterns - see full log on the run page)"
            echo '```'
            echo
            echo '## Tail of build.log'
            echo '```'
            tail -60 build.log
            echo '```'
          } > issue-body.md
          # Re-running a failed workflow used to file a duplicate issue
          # with the identical title. Skip if one is already open.
          EXISTING=$(gh issue list --search "CI failure: ${GITHUB_SHA:0:7}" --state open --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" != "0" ]; then
            echo "An open issue for this commit already exists - skipping."
            exit 0
          fi
          gh issue create \
            --title "CI failure: ${GITHUB_SHA:0:7}" \
            --body-file issue-body.md \
            --label ci-failure || \
          gh issue create \
            --title "CI failure: ${GITHUB_SHA:0:7}" \
            --body-file issue-body.md
